<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost & Found</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#f4f5f7;color:#222;font:15px/1.5 Arial,Helvetica,sans-serif}
a{color:inherit}
.top{background:#1f3a5f;color:#fff;padding:14px 20px}
.top div{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px}
.top b{font-size:20px}
.top span{font-size:13px;opacity:.8}
.page{max-width:1000px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
.box{background:#fff;border:1px solid #d5d9df;border-radius:3px}
aside{position:sticky;top:12px}
summary{padding:12px 14px;font-weight:bold;cursor:pointer}
form{padding:0 14px 14px}
label{display:block;margin-top:10px;font-size:13px;color:#444}
input,select,textarea{display:block;width:100%;margin-top:3px;padding:7px 8px;font:inherit;border:1px solid #b9c0ca;border-radius:3px;background:#fff}
input[type=radio]{display:inline;width:auto;margin:0 4px 0 0}
.radio label{display:inline-block;margin-right:14px;color:#222;font-size:14px}
button{font:inherit;padding:7px 12px;border:1px solid #b9c0ca;background:#f4f5f7;border-radius:3px;cursor:pointer}
button:hover{background:#e8ebef}
button.main{background:#1f3a5f;border-color:#1f3a5f;color:#fff}
button.main:hover{background:#2a4b7a}
button.del{color:#b42318}
.full{width:100%;margin-top:14px}
.err{color:#b42318;font-size:13px;margin:8px 0 0;min-height:1em}
#prev{max-width:100%;max-height:120px;margin-top:6px}
.tools{padding:10px 14px 0}
.tools input{margin:0 0 10px}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid #d5d9df}
.tabs button{border:0;background:none;border-bottom:3px solid transparent;border-radius:0;padding:8px 12px;margin-bottom:-1px}
.tabs button[aria-pressed=true]{border-bottom-color:#1f3a5f;font-weight:bold}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:14px;padding:14px;border-bottom:1px solid #e6e9ed}
.row:last-child{border-bottom:0}
.ph{width:96px;height:96px;background:#e9ecf0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#777;text-align:center}
.ph img{width:100%;height:100%;object-fit:cover}
h3{margin:0 0 4px;font-size:16px}
.st{font-size:13px;font-weight:normal;margin-left:6px}
.lost .st{color:#b42318}.found .st{color:#067647}.returned .st{color:#666}
.returned h3{color:#666}
dl{margin:0;font-size:13px;color:#555}
dl div{display:flex;gap:6px}
dt{width:56px;color:#888}
dd{margin:0}
.bd p{margin:6px 0 0}
.ct{font-size:13px;color:#1f3a5f}
.ac{display:flex;flex-direction:column;gap:6px}
.ac .claim-login{display:inline-block;padding:7px 12px;background:#1f3a5f;border-radius:3px;color:#fff;text-decoration:none;font-size:14px;text-align:center}
.none{padding:30px 14px;color:#666}
.top .account{display:flex;align-items:center;gap:10px}
.top .account button{color:#222;padding:4px 9px}
.top .guest-actions{display:flex;gap:8px}
.top .guest-actions a{padding:4px 9px;color:#222;text-decoration:none;background:#f4f5f7;border:1px solid #b9c0ca;border-radius:3px}
.top .guest-actions a.main{background:#1f3a5f;border-color:#1f3a5f;color:#fff}
.guest-report{padding:14px}
.guest-report p{margin:0 0 10px;color:#555}
.guest-report a{display:block;width:100%;padding:7px 12px;text-align:center;border-radius:3px;color:#fff;background:#1f3a5f;text-decoration:none}
.guest-report a:hover{background:#2a4b7a}
.notice{max-width:968px;margin:12px auto;padding:9px 12px;background:#fff6dd;border:1px solid #e8ce83;border-radius:3px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.notice button{flex:0 0 auto}
dialog{border:1px solid #888;border-radius:3px;width:min(400px,92vw);padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
dialog h2{margin:0 0 6px;font-size:18px}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
@media(max-width:800px){.page{grid-template-columns:1fr}aside{position:static}.row{grid-template-columns:80px 1fr}.ph{width:80px;height:80px}.ac{grid-column:1/-1;flex-direction:row}}
</style>
</head>
<body>
<div class="top"><div><b>Lost &amp; Found</b><span>Laporan barang hilang dan barang temuan</span><span class="guest-actions" id="guestActions"><a href="login.html">Masuk</a><a class="main" href="login.html?mode=signup">Buat akun</a></span><span class="account" id="account" hidden><span id="accountEmail"></span><button type="button" id="logout">Keluar</button></span></div></div>
<div class="notice" id="notice" role="status" aria-live="polite" hidden><span id="noticeText"></span><button type="button" id="dismissNotice">Tutup</button></div>

<div class="page" id="app">
<aside class="box">
<div class="guest-report" id="guestReport" hidden>
  <p>Ingin melaporkan barang hilang atau temuan?</p>
  <a class="main" href="login.html">Masuk atau buat akun</a>
</div>
<details id="det" open hidden>
<summary>Buat laporan baru</summary>
<form id="fReport" novalidate>
  <div class="radio">
    <label><input type="radio" name="type" value="lost" checked>Barang hilang</label>
    <label><input type="radio" name="type" value="found">Barang temuan</label>
  </div>
  <label>Nama barang<input name="name" maxlength="80"></label>
  <label>Kategori
    <select name="category"><option>Dompet dan tas</option><option>Elektronik</option><option>Kunci</option><option>Dokumen dan kartu</option><option>Pakaian dan aksesori</option><option>Lainnya</option></select>
  </label>
  <label>Lokasi<input name="location" maxlength="100"></label>
  <label>Tanggal<input type="date" name="date"></label>
  <label>Ciri-ciri<textarea name="description" rows="3" maxlength="300"></textarea></label>
  <label>Kontak (WA atau email)<input name="contact" maxlength="80"></label>
  <label>Foto (boleh kosong)<input type="file" id="photo" accept="image/*"></label>
  <img id="prev" alt="" hidden>
  <p class="err" id="eReport"></p>
  <button class="main full">Simpan laporan</button>
</form>
</details>
</aside>

<section class="box">
  <div class="tools"><input id="q" type="search" placeholder="Cari barang atau lokasi" aria-label="Cari"></div>
  <div class="tabs" id="tabs"></div>
  <ul id="list"></ul>
</section>
</div>

<dialog id="dClaim">
  <form id="fClaim" novalidate>
    <h2>Konfirmasi barang kembali</h2>
    <p id="hint" style="margin:0;font-size:13px;color:#555"></p>
    <label>Nama<input name="who" maxlength="60"></label>
    <label>Kontak<input name="contact" maxlength="80"></label>
    <p class="err" id="eClaim"></p>
    <div class="btns"><button type="button" id="cancel">Batal</button><button class="main">Simpan</button></div>
  </form>
</dialog>

<script src="./assets/lostfound-domain.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
const TABS = [["all", "Semua"], ["lost", "Hilang"], ["found", "Temuan"], ["returned", "Sudah kembali"]];
const LABEL = { lost: "Hilang", found: "Temuan", returned: "Sudah kembali" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = (n) => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
const fmt = (d) => new Date(d + "T00:00:00").toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
const state = (i) => (i.status === "done" ? "returned" : i.type);

let client = null, user = null, items = [], filter = "all", claimId = null, photo = "", channel = null;

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const count = (k) => items.filter((i) => k === "all" || state(i) === k).length;
  $("#tabs").innerHTML = TABS.map(([k, t]) => `<button data-tab="${k}" aria-pressed="${k === filter}">${t} (${count(k)})</button>`).join("");

  const rows = LostFoundDomain.filterReports(items, filter, q)
    .sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));

  $("#list").innerHTML = rows.length ? rows.map(row).join("") : `<li class="none">Belum ada laporan yang cocok.</li>`;
}

function row(i) {
  const s = state(i);
  const claim = i.type === "lost" ? "Saya menemukannya" : "Ini punya saya";
  return `<li class="row ${s}">
    <div class="ph">${i.photo ? `<img src="${i.photo}" alt="Foto ${esc(i.name)}">` : "Tanpa foto"}</div>
    <div class="bd">
      <h3>${esc(i.name)}<span class="st">${LABEL[s]}</span></h3>
      <dl>
        <div><dt>Lokasi</dt><dd>${esc(i.location)}</dd></div>
        <div><dt>Tanggal</dt><dd>${fmt(i.date)}</dd></div>
        <div><dt>Jenis</dt><dd>${esc(i.category)}</dd></div>
      </dl>
      ${i.description ? `<p>${esc(i.description)}</p>` : ""}
      ${user ? `<p class="ct">${s === "returned" ? `Dikembalikan ke/oleh ${esc(i.who)} (${esc(i.whoContact)})` : `Kontak: ${esc(i.contact)}`}</p>` : ""}
    </div>
    <div class="ac">
      ${LostFoundDomain.canClaim(i, user) ? `<button class="main" data-act="claim" data-id="${esc(i.id)}">${claim}</button>` : !user && s !== "returned" ? `<a class="claim-login" href="login.html">Masuk untuk klaim</a>` : ""}
      ${LostFoundDomain.canDeleteReport(i, user) ? `<button class="del" data-act="del" data-id="${esc(i.id)}">Hapus</button>` : ""}
    </div>
  </li>`;
}

function showError(selector, message) {
  $(selector).textContent = message || "";
}

function errorText(error) {
  return error?.message || String(error);
}

function mapItem(row) {
  return {
    id: row.id, userId: row.user_id, type: row.type, name: row.name, category: row.category,
    location: row.location, date: row.date, description: row.description, contact: row.contact,
    status: row.status, who: row.who, whoContact: row.who_contact, photo: row.photo
  };
}

async function refreshItems() {
  try {
    if (!client) {
      render();
      $("#list").innerHTML = `<li class="none">Laporan belum dapat dimuat. Admin perlu menghubungkan project Supabase.</li>`;
      return;
    }
    const source = user ? "lostfound_items" : "lostfound_public";
    const { data, error } = await client.from(source).select("*").order("date", { ascending: false }).order("created_at", { ascending: false });
    if (error) {
      $("#list").innerHTML = `<li class="none">Gagal memuat laporan. ${esc(error.message)}</li>`;
      return;
    }
    items = data.map(mapItem);
    render();
  } catch (error) {
    $("#list").innerHTML = `<li class="none">Gagal memuat laporan. ${esc(errorText(error))}</li>`;
  }
}

function notifyChange(payload) {
  const record = payload.new || payload.old || {};
  if (!record.user_id || record.user_id === user.id) return;
  const descriptions = {
    INSERT: `Laporan baru: ${record.name || "Barang"}`,
    UPDATE: `Laporan diperbarui: ${record.name || "Barang"}`,
    DELETE: `Laporan dihapus: ${record.name || "Barang"}`
  };
  const message = descriptions[payload.eventType];
  if (!message) return;
  $("#noticeText").textContent = message;
  $("#notice").hidden = false;
}

function subscribeToChanges() {
  if (channel) client.removeChannel(channel);
  channel = client.channel("lostfound-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "lostfound_items" }, async (payload) => {
      notifyChange(payload);
      await refreshItems();
    })
    .subscribe((status) => {
      if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
        $("#list").innerHTML = `<li class="none">Koneksi notifikasi realtime gagal. Muat ulang halaman untuk mencoba lagi.</li>`;
      }
    });
}

async function syncAuth() {
  const loggedIn = Boolean(user);
  $("#account").hidden = !loggedIn;
  $("#guestActions").hidden = loggedIn;
  $("#guestReport").hidden = loggedIn;
  $("#det").hidden = !loggedIn;
  if (loggedIn) {
    $("#accountEmail").textContent = user.email;
    if (guestRefreshTimer) { clearInterval(guestRefreshTimer); guestRefreshTimer = null; }
    await refreshItems();
    subscribeToChanges();
  } else {
    if (channel) { await client.removeChannel(channel); channel = null; }
    await refreshItems();
    if (!guestRefreshTimer && client) guestRefreshTimer = setInterval(refreshItems, 30000);
  }
}

$("#tabs").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (b) { filter = b.dataset.tab; render(); } };
$("#q").oninput = render;

$("#photo").onchange = (e) => {
  photo = ""; $("#prev").hidden = true;
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    const r = Math.min(1, 360 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = img.width * r; c.height = img.height * r;
    const context = c.getContext("2d");
    if (!context) { showError("#eReport", "Foto tidak dapat diproses di browser ini."); return; }
    context.drawImage(img, 0, 0, c.width, c.height);
    photo = c.toDataURL("image/jpeg", 0.7);
    $("#prev").src = photo; $("#prev").hidden = false;
    URL.revokeObjectURL(img.src);
  };
  img.onerror = () => { showError("#eReport", "Foto tidak dapat dibaca."); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
};

function resetForm() {
  const f = $("#fReport");
  f.reset(); photo = ""; $("#prev").hidden = true;
  f.date.value = ago(0);
}

$("#fReport").onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target, v = (n) => f.elements[n].value.trim();
  const item = { type: f.elements.type.value, name: v("name"), category: f.category.value, location: v("location"),
    date: f.date.value, description: v("description"), contact: v("contact"), photo };
  const validationError = LostFoundDomain.validateReport(item);
  const reportErrors = {
    invalid_type: "Pilih jenis laporan yang valid.",
    name_required: "Nama barang harus diisi.",
    name_too_long: "Nama barang maksimal 80 karakter.",
    category_required: "Kategori harus diisi.",
    category_too_long: "Kategori maksimal 40 karakter.",
    location_required: "Lokasi harus diisi.",
    location_too_long: "Lokasi maksimal 100 karakter.",
    contact_required: "Kontak harus diisi.",
    contact_too_long: "Kontak maksimal 80 karakter.",
    invalid_date: "Tanggal harus diisi dengan tanggal yang valid.",
    description_too_long: "Ciri-ciri maksimal 300 karakter."
  };
  if (validationError) { showError("#eReport", reportErrors[validationError]); return; }
  item.user_id = user.id;
  try {
    const { error } = await client.from("lostfound_items").insert(item);
    if (error) { showError("#eReport", `Gagal menyimpan laporan: ${error.message}`); return; }
    resetForm(); showError("#eReport", ""); await refreshItems();
  } catch (error) {
    showError("#eReport", `Gagal menyimpan laporan: ${errorText(error)}`);
  }
};

$("#list").onclick = async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const id = b.dataset.id, it = items.find((i) => i.id === id);
  if (!it) return;
  if (b.dataset.act === "del") {
    if (!LostFoundDomain.canDeleteReport(it, user)) return;
    if (confirm(`Hapus laporan "${it.name}"?`)) {
      try {
        const { error } = await client.from("lostfound_items").delete().eq("id", id);
        if (error) { alert(`Gagal menghapus laporan: ${error.message}`); return; }
        await refreshItems();
      } catch (error) {
        alert(`Gagal menghapus laporan: ${errorText(error)}`);
      }
    }
    return;
  }
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  if (!LostFoundDomain.canClaim(it, user)) { await refreshItems(); return; }
  claimId = id;
  $("#hint").textContent = it.type === "lost" ? "Isi data kamu sebagai penemu." : "Isi data kamu sebagai pemilik. Serahkan barang setelah ciri-cirinya cocok.";
  $("#fClaim").reset(); $("#eClaim").textContent = "";
  $("#dClaim").showModal();
};

$("#cancel").onclick = () => $("#dClaim").close();
$("#fClaim").onsubmit = async (e) => {
  e.preventDefault();
  const who = e.target.elements.who.value.trim(), contact = e.target.elements.contact.value.trim();
  const validationError = LostFoundDomain.validateClaim({ name: who, contact });
  const claimErrors = {
    name_required: "Nama harus diisi.",
    name_too_long: "Nama maksimal 60 karakter.",
    contact_required: "Kontak harus diisi.",
    contact_too_long: "Kontak maksimal 80 karakter."
  };
  if (validationError) { showError("#eClaim", claimErrors[validationError]); return; }
  const item = items.find((entry) => entry.id === claimId);
  if (!LostFoundDomain.canClaim(item, user)) {
    showError("#eClaim", "Laporan ini sudah selesai atau bukan lagi tersedia untuk diklaim.");
    return;
  }
  try {
    const { data, error } = await client.from("lostfound_items")
      .update({ status: "done", who, who_contact: contact })
      .eq("id", claimId)
      .eq("status", "open")
      .neq("user_id", user.id)
      .select("id")
      .maybeSingle();
    if (error) { showError("#eClaim", `Gagal menyimpan perubahan: ${error.message}`); return; }
    if (!data) { showError("#eClaim", "Laporan sudah diklaim atau tidak tersedia."); await refreshItems(); return; }
    $("#dClaim").close(); await refreshItems();
  } catch (error) {
    showError("#eClaim", `Gagal menyimpan perubahan: ${errorText(error)}`);
  }
};

$("#logout").onclick = async () => {
  try {
    const { error } = await client.auth.signOut();
    if (error) alert(`Gagal keluar: ${error.message}`);
  } catch (error) {
    alert(`Gagal keluar: ${errorText(error)}`);
  }
};
$("#dismissNotice").onclick = () => { $("#notice").hidden = true; };

const config = window.SUPABASE_CONFIG || {};
if (window.supabase && config.url && config.anonKey) {
  client = window.supabase.createClient(config.url, config.anonKey);
  client.auth.getSession().then(async ({ data, error }) => {
    if (error) {
      $("#list").innerHTML = `<li class="none">Gagal memeriksa sesi: ${esc(error.message)}</li>`;
      return;
    }
    user = data.session?.user || null;
    await syncAuth();
  }).catch((error) => {
    $("#list").innerHTML = `<li class="none">Gagal memeriksa sesi: ${esc(errorText(error))}</li>`;
  });
  client.auth.onAuthStateChange((event, session) => {
    if (event === "INITIAL_SESSION") return;
    setTimeout(() => {
      user = session?.user || null;
      syncAuth();
    }, 0);
  });
} else {
  $("#list").innerHTML = `<li class="none">Laporan belum dapat dimuat. Admin perlu menghubungkan project Supabase.</li>`;
}

$("#det").open = innerWidth > 800;
resetForm();
let guestRefreshTimer = null;
syncAuth();
</script>
</body>
</html>
